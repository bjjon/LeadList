services:
  postgres:
    ports:
      - "5432:5432"

  nginx:
    ports:
      - "80:80"
    volumes:
      # Local dev has no real TLS certs — serve HTTP-only config and point the
      # VPS-only IONOS cert mount at an empty local dir instead of /root/nginx-proxy/ionos.
      - ./nginx/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/empty:/etc/nginx/ionos:ro
